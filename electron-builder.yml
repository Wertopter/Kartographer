appId: com.kartographer.app
productName: Kartographer
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
mac:
  category: public.app-category.games
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
